version: '3.8'  

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/usr/src/app:cached
      - /usr/src/app/node_modules
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/devdb
    ports:
      - "4000:4000"
    command: ["npm", "run", "dev"]
    depends_on:
      - mongo

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  mongo-data:

networks:
  default:
    name: devops_project_network
